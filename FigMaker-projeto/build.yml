name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Baixar libwebp (encoder de WebP animado)
        run: git clone --depth 1 --branch v1.4.0 https://github.com/webmproject/libwebp.git app/src/main/cpp/libwebp

      - name: Instalar NDK e CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FigMaker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FigMaker-APK
          path: FigMaker.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FigMaker build ${{ github.run_number }}
          files: FigMaker.apk
